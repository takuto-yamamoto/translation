<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLaMo 論文翻訳</title>
<script>
  // テーマはちらつかないように最初に適用
  try { const t = JSON.parse(localStorage.getItem('plamo-settings') || '{}').theme; if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  /* 目に優しいライト（生成り色） */
  :root, :root[data-theme="light"] {
    --bg: #f4f0e6; --card: #fbf8f1; --ink: #33302a; --sub: #7a7366; --line: #e2dccd;
    --accent: #3d63c9; --accent-ink: #fff; --ok: #2f7d4f; --warn: #a8670a; --err: #b23b2e;
    --shadow: 0 2px 10px rgba(60,50,30,.08); --page-filter: none;
  }
  :root[data-theme="dark"] {
    --bg: #18181a; --card: #222225; --ink: #e6e4df; --sub: #9a9890; --line: #34343a;
    --accent: #85a2ff; --accent-ink: #111; --ok: #5cc28a; --warn: #e0a548; --err: #ef7b6e;
    --shadow: 0 2px 12px rgba(0,0,0,.4); --page-filter: brightness(.86) sepia(.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #18181a; --card: #222225; --ink: #e6e4df; --sub: #9a9890; --line: #34343a;
      --accent: #85a2ff; --accent-ink: #111; --ok: #5cc28a; --warn: #e0a548; --err: #ef7b6e;
      --shadow: 0 2px 12px rgba(0,0,0,.4); --page-filter: brightness(.86) sepia(.08);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.75 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  [hidden] { display: none !important; }
  button, select, input[type=text], textarea {
    font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  button { padding: 6px 14px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  select { padding: 6px 8px; }

  /* 右上に浮かぶ小さな操作パネル */
  #fab { position: fixed; top: 10px; right: 12px; z-index: 50; display: flex; gap: 6px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 4px 6px; box-shadow: var(--shadow); }
  #fab button { border: 0; background: transparent; padding: 3px 9px; border-radius: 99px; font-size: 13px; }
  #fab button:hover { background: var(--bg); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); padding: 2px 8px; cursor: pointer; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sub); }
  .pill.ok .dot { background: var(--ok); } .pill.warn .dot { background: var(--warn); } .pill.err .dot { background: var(--err); }
  #fabStop { color: var(--err); }

  /* 最初の画面だけのタイトル */
  #hero { padding: 48px 20px 10px; text-align: center; }
  #hero h1 { margin: 0; font-size: 26px; letter-spacing: .02em; }
  #hero p { margin: 4px 0 0; color: var(--sub); font-size: 14px; }

  .banner { max-width: 860px; margin: 16px auto 0; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--err);
    background: color-mix(in srgb, var(--err) 9%, var(--card)); }
  .banner b { color: var(--err); }
  .banner .hint { margin-top: 4px; }
  pre.cmd { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0;
    font-size: 12.5px; white-space: pre-wrap; word-break: break-all; user-select: all; }

  #inputView { max-width: 860px; margin: 0 auto; padding: 20px; }
  .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 30px 18px; text-align: center; color: var(--sub); background: var(--card); }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  .drop .big { font-size: 17px; color: var(--ink); }
  .drop label { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .chip { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border: 1px solid var(--accent); border-radius: 12px; background: var(--card); margin-top: 12px; }
  .chip .name { font-weight: 600; flex: 1; word-break: break-all; }
  .chip button { padding: 2px 10px; font-size: 13px; }
  .or { text-align: center; color: var(--sub); font-size: 13px; margin: 14px 0 8px; }
  textarea#src { width: 100%; min-height: 140px; padding: 12px; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0; }
  .grow { flex: 1; }
  .hint { color: var(--sub); font-size: 13px; }

  /* 結果画面 */
  #resultView { padding: 8px 10px 40px; }
  .rbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 210px 10px 2px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 12px; font-size: 13px; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .rbar > button { font-size: 13px; padding: 5px 12px; }
  #progress { color: var(--sub); font-size: 13px; }

  /* テキスト表示 */
  .pair { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; margin: 0 auto 10px; overflow: hidden; max-width: 1500px; }
  .pair > div { padding: 12px 16px; white-space: pre-wrap; word-break: break-word; }
  .pair .en { color: var(--sub); font-size: 14px; border-right: 1px solid var(--line); }
  .pair .ja { position: relative; }
  .pending { color: var(--sub); font-style: italic; }
  .error { color: var(--err); }
  .redo { position: absolute; right: 8px; bottom: 6px; font-size: 12px; padding: 1px 8px; opacity: 0; }
  .pair:hover .redo { opacity: 1; }
  .only-ja .pair { grid-template-columns: 1fr; max-width: 900px; } .only-ja .pair .en { display: none; }

  /* レイアウト表示 */
  .pageRow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 auto 14px; max-width: 2000px; }
  .only-ja .pageRow { grid-template-columns: 1fr; max-width: 1000px; }
  .only-ja .pageRow .orig { display: none; }
  .page { position: relative; background: #fff; box-shadow: var(--shadow); border-radius: 2px; overflow: hidden; filter: var(--page-filter); }
  .page canvas { display: block; width: 100%; height: 100%; }
  .ov { position: absolute; background: #fff; color: #111; overflow: hidden; line-height: 1.32; padding: 0 1px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; text-align: justify; word-break: break-all; }
  .ov.wait { background: rgba(255,255,255,0); }
  .ov.wait::after { content: ""; position: absolute; inset: 0; background: rgba(61,99,201,.10); animation: pulse 1.2s ease-in-out infinite; }
  .ov.wait.queued::after { animation: none; background: rgba(61,99,201,.05); }
  @keyframes pulse { 50% { opacity: .35; } }
  .ov.clipped:hover { overflow: visible; height: auto !important; min-height: var(--h); z-index: 5; box-shadow: 0 4px 18px rgba(0,0,0,.25); }
  .pageNo { text-align: center; color: var(--sub); font-size: 12px; margin: -8px 0 10px; }
  @media (max-width: 760px) {
    .pair, .pageRow { grid-template-columns: 1fr; } .pair .en { border-right: 0; border-bottom: 1px solid var(--line); }
    .rbar { padding-right: 2px; padding-top: 52px; }
  }

  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); width: min(640px, 94vw); padding: 22px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { margin: 0 0 12px; font-size: 18px; }
  dialog label.f { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 14px; }
  dialog input[type=text], dialog textarea { width: 100%; padding: 8px 10px; }
  dialog textarea { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }

  @media print {
    body { background: #fff; }
    #fab, #hero, #inputView, .rbar, #offline, #textView, .pageNo, .pageRow .orig { display: none !important; }
    #resultView { padding: 0; }
    .pageRow { display: block; margin: 0; max-width: none; break-after: page; }
    .page { box-shadow: none; filter: none; border-radius: 0; }
    .ov.wait::after { display: none; }
  }
</style>
</head>
<body>

<div id="fab">
  <span id="status" class="pill" title="クリックで再接続"><span class="dot"></span><span id="statusText">確認中…</span></span>
  <button id="fabStop" hidden>■ 止める</button>
  <button id="themeBtn" title="テーマを切り替え">◐</button>
  <button id="settingsBtn" title="設定">⚙︎ 設定</button>
</div>

<header id="hero">
  <h1>PLaMo 論文翻訳</h1>
  <p>Mac の中だけで動く、英語論文の翻訳ツール</p>
</header>

<div id="offline" class="banner" hidden>
  <b id="offTitle">Ollama が起動していません</b>
  <div id="offBody" class="hint"></div>
</div>

<section id="inputView">
  <div id="drop" class="drop">
    <div class="big">論文の PDF をここにドロップ</div>
    <div>または <label>ファイルを選ぶ<input type="file" id="file" accept=".pdf,application/pdf" hidden></label></div>
    <div class="hint">レイアウトをそのままに、日本語に置き換えて表示します</div>
  </div>
  <div id="pdfChip" class="chip" hidden>
    <span>📄</span><span class="name" id="pdfName"></span><span class="hint" id="pdfInfo"></span>
    <button id="pdfClear">別のPDF</button>
  </div>

  <div class="or" id="orLine">または、文章を貼り付け</div>
  <textarea id="src" placeholder="英語の文章を貼り付け（PDFからコピーした改行はそのままでOK。段落は自動で分けます）"></textarea>

  <div class="row">
    <select id="target" title="翻訳先">
      <option value="ja">→ 日本語</option>
      <option value="en">→ 英語</option>
    </select>
    <select id="form" title="文体（日本語のみ）">
      <option value="plain">である調</option>
      <option value="polite">です・ます調</option>
      <option value="">文体指定なし</option>
    </select>
    <span class="grow"></span>
    <button id="go" class="primary">翻訳する（⌘+Enter）</button>
  </div>
</section>

<section id="resultView" hidden>
  <div class="rbar">
    <button id="back">← 新しく翻訳</button>
    <span class="seg" id="viewSeg"><button data-v="layout">レイアウト</button><button data-v="text">テキスト</button></span>
    <span class="seg" id="sideSeg"><button data-s="both">原文と並べる</button><button data-s="ja">訳だけ</button></span>
    <span id="progress"></span>
    <span class="grow"></span>
    <button id="copyAll">訳文をコピー</button>
    <button id="dlMd">Markdown保存</button>
    <button id="printBtn">印刷 / PDF保存</button>
  </div>
  <div id="layoutView"></div>
  <div id="textView"></div>
</section>

<dialog id="settings">
  <h2>設定</h2>
  <label class="f">画面のテーマ</label>
  <span class="seg" id="themeSeg"><button data-t="light">ライト（生成り）</button><button data-t="dark">ダーク</button><button data-t="auto">Macに合わせる</button></span>

  <label class="f" for="glossary">用語集（1行に1つ「英語 = 訳語」）</label>
  <textarea id="glossary" placeholder="attention = アテンション&#10;fine-tuning = ファインチューニング&#10;baseline = ベースライン"></textarea>
  <div class="hint">段落に出てくる用語だけをモデルに渡します。</div>

  <label class="f"><input type="checkbox" id="useContext"> 直前の段落を文脈としてモデルに渡す（訳のつながりが良くなる）</label>
  <label class="f"><input type="checkbox" id="cutRefs"> 「References」以降は翻訳しない</label>

  <details style="margin-top:14px">
    <summary class="hint">詳細設定</summary>
    <label class="f" for="url">Ollama のアドレス</label>
    <input type="text" id="url">
    <label class="f" for="model">モデル名</label>
    <input type="text" id="model">
    <div class="hint">8B を試すなら <code>hf.co/pfnet/plamo-3-translate-8b-GGUF:Q3_K_M</code>（ターミナルで一度 <code>ollama run</code> しておく）</div>
  </details>

  <div class="row" style="margin-top:18px">
    <span class="grow"></span>
    <button id="closeSettings" class="primary">閉じる</button>
  </div>
</dialog>

<script type="module">
const STOP = ['<|plamo:tag|>', '<|plamo:bos|>'];
const DEFAULTS = {
  url: 'http://localhost:11434',
  model: 'hf.co/pfnet/plamo-3-translate-2b-GGUF:Q4_K_M',
  target: 'ja', form: 'plain', glossary: '', useContext: true, cutRefs: true,
  theme: 'auto', view: 'layout', side: 'both',
};
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

// ================= 設定 =================
let S = { ...DEFAULTS };
try { S = { ...DEFAULTS, ...JSON.parse(localStorage.getItem('plamo-settings') || '{}') }; } catch {}
const save = () => { try { localStorage.setItem('plamo-settings', JSON.stringify(S)); } catch {} };

$('#target').value = S.target; $('#form').value = S.form;
$('#url').value = S.url; $('#model').value = S.model; $('#glossary').value = S.glossary;
$('#useContext').checked = S.useContext; $('#cutRefs').checked = S.cutRefs;
const syncForm = () => { $('#form').disabled = $('#target').value !== 'ja'; };
syncForm();
$('#target').onchange = () => { S.target = $('#target').value; syncForm(); save(); };
$('#form').onchange = () => { S.form = $('#form').value; save(); };
for (const id of ['url', 'model']) $('#' + id).oninput = (e) => { S[id] = e.target.value.trim() || DEFAULTS[id]; save(); };
$('#glossary').oninput = (e) => { S.glossary = e.target.value; save(); };
for (const id of ['useContext', 'cutRefs']) $('#' + id).onchange = (e) => { S[id] = e.target.checked; save(); };
$('#settingsBtn').onclick = () => $('#settings').showModal();
$('#closeSettings').onclick = () => { $('#settings').close(); checkConnection(); };

// ================= テーマ =================
function applyTheme() {
  if (S.theme === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = S.theme;
  $$('#themeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.t === S.theme));
  $('#themeBtn').textContent = S.theme === 'light' ? '☀︎' : S.theme === 'dark' ? '☾' : '◐';
  $('#themeBtn').title = 'テーマ：' + { light: 'ライト', dark: 'ダーク', auto: 'Macに合わせる' }[S.theme] + '（クリックで切り替え）';
}
$$('#themeSeg button').forEach((b) => (b.onclick = () => { S.theme = b.dataset.t; save(); applyTheme(); }));
$('#themeBtn').onclick = () => { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; save(); applyTheme(); };
applyTheme();

// ================= 接続確認（つながるまで自動で再試行） =================
const base = () => S.url.replace(/\/+$/, '');
let connected = false, retryTimer = null;
function setStatus(cls, text) { $('#status').className = 'pill ' + cls; $('#statusText').textContent = text; }

async function checkConnection() {
  clearTimeout(retryTimer);
  try {
    const r = await fetch(base() + '/api/tags');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const { models = [] } = await r.json();
    const want = S.model.toLowerCase();
    const has = models.some((m) => (m.name || m.model || '').toLowerCase() === want);
    connected = true;
    if (has) { setStatus('ok', '接続OK'); $('#offline').hidden = true; }
    else {
      setStatus('warn', 'モデル未ダウンロード');
      showOffline('モデルがまだダウンロードされていません',
        `ターミナルで次を一度実行してください。<pre class="cmd">ollama run ${esc(S.model)}</pre>`);
    }
  } catch {
    connected = false;
    // 動いているのに断られているのか、そもそも動いていないのかを見分ける
    let alive = false;
    try { await fetch(base() + '/api/version', { mode: 'no-cors' }); alive = true; } catch {}
    setStatus('err', alive ? '接続が許可されていません' : 'Ollama 未起動');
    if (alive) showOffline('Ollama は動いていますが、このページからの接続が許可されていません',
      `ターミナルで次を実行してください（Ollama が新しい設定で起動し直します）。<pre class="cmd">pkill -x ollama; pkill -x Ollama; sleep 1; open -a Ollama</pre>
       Chrome で「ローカル ネットワークへのアクセス」を聞かれたら「許可」を押してください。`);
    else showOffline('Ollama が起動していません',
      'Launchpad かアプリケーションフォルダから <b>Ollama</b> を開いてください。起動したら自動でつながります。');
    retryTimer = setTimeout(checkConnection, 4000);
  }
}
function showOffline(title, html) { $('#offTitle').textContent = title; $('#offBody').innerHTML = html; $('#offline').hidden = false; }
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('#status').onclick = () => checkConnection();
checkConnection();

// ================= テキストの整形 =================
function clean(t) {
  return t.replace(/(\p{Ll})-\n(\p{Ll})/gu, '$1$2').replace(/\s*\n\s*/g, ' ')
    .replace(/[ \t ]{2,}/g, ' ').replace(/<\|plamo:[a-z]+\|>/g, '').trim();
}
const endsSentence = (t) => /[.!?:]["')\]]?$/.test(t);

function splitParagraphs(text) {
  text = text.replace(/\r\n?/g, '\n').trim();
  if (!text) return [];
  let blocks = text.split(/\n[ \t]*\n+/);
  if (blocks.length === 1 && text.split('\n').length > 4) {
    const lines = text.split('\n');
    const lens = lines.map((l) => l.trim().length).sort((a, b) => a - b);
    const typical = lens[Math.floor(lens.length * 0.8)] || 80;
    blocks = []; let cur = [];
    for (const l of lines) {
      cur.push(l); const t = l.trim();
      if (endsSentence(t) && t.length < typical * 0.75) { blocks.push(cur.join('\n')); cur = []; }
    }
    if (cur.length) blocks.push(cur.join('\n'));
  }
  return blocks.map(clean).filter(Boolean);
}

// 長い段落は文の区切りで分ける（2Bモデルは短い方が訳が安定する）
function chunk(p, max = 1200) {
  if (p.length <= max) return [p];
  const sents = p.split(/(?<=[.!?])\s+(?=[A-Z(\[“"])/);
  const res = []; let cur = '';
  for (const s of sents) {
    if (cur && (cur + ' ' + s).length > max) { res.push(cur); cur = s; } else cur = cur ? cur + ' ' + s : s;
  }
  if (cur) res.push(cur);
  return res;
}

// 数式・図の中の文字・ページ番号などは訳さない
function translatable(t) {
  const words = t.match(/\p{L}{2,}/gu) || [];
  const letters = (t.match(/\p{L}/gu) || []).length;
  const ratio = letters / Math.max(1, t.replace(/\s/g, '').length);
  if (words.length >= 3) return ratio > 0.55;
  if (words.length >= 1) return ratio > 0.7 && t.length >= 4;
  return false;
}
const isRefsHeading = (t) => /^(\d+\.?\s*)?(references|bibliography|参考文献)$/i.test(t.trim());

// ================= PDF =================
let pdfjs = null;
async function loadPdfjs() {
  if (pdfjs) return pdfjs;
  const v = '4.10.38';
  pdfjs = await import(`https://cdn.jsdelivr.net/npm/pdfjs-dist@${v}/build/pdf.min.mjs`);
  pdfjs.GlobalWorkerOptions.workerSrc = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${v}/build/pdf.worker.min.mjs`;
  return pdfjs;
}

let pdf = null; // { doc, name, pages: [{vp1}], blocks: [] }

async function readPdf(file) {
  const lib = await loadPdfjs();
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [], blocks = [];
  for (let n = 1; n <= doc.numPages; n++) {
    $('#pdfInfo').textContent = `読み込み中… ${n}/${doc.numPages}`;
    const page = await doc.getPage(n);
    const vp1 = page.getViewport({ scale: 1 });
    pages.push({ vp1 });
    const tc = await page.getTextContent();
    // テキスト片 → 行
    const lines = []; let L = null;
    for (const it of tc.items) {
      if (!('str' in it)) continue;
      const x = it.transform[4], y = it.transform[5];
      const h = Math.abs(it.height) || Math.hypot(it.transform[2], it.transform[3]) || 10;
      if (it.str.trim()) {
        if (!L) L = { text: '', x0: x, x1: x + it.width, y, h, font: it.fontName };
        L.text += it.str; L.x0 = Math.min(L.x0, x); L.x1 = Math.max(L.x1, x + it.width);
        L.h = Math.max(L.h, h); L.y = Math.min(L.y, y);
      } else if (L && it.str) L.text += ' ';
      if (it.hasEOL && L) { lines.push(L); L = null; }
    }
    if (L) lines.push(L);
    const gaps = [];
    for (let i = 1; i < lines.length; i++) { const g = lines[i - 1].y - lines[i].y; if (g > 0) gaps.push(g); }
    gaps.sort((a, b) => a - b);
    const typGap = gaps[Math.floor(gaps.length / 2)] || 12;
    const widths = lines.map((l) => l.x1 - l.x0).sort((a, b) => a - b);
    const typW = widths[Math.floor(widths.length * 0.7)] || 200;
    const short = (l) => l.x1 - l.x0 < typW * 0.6;

    // 行 → 段落ブロック（位置つき）
    let cur = null, prev = null;
    const flush = () => { if (cur) blocks.push(finishBlock(cur, n)); cur = null; };
    for (const ln of lines) {
      const t = ln.text.trim();
      if (/^\d{1,4}$/.test(t)) continue;
      let brk = !cur;
      if (cur && prev) {
        const gap = prev.y - ln.y;
        if (gap < -2 || gap > typGap * 1.6) brk = true;                       // 段組みの移動・大きな行間
        else if (Math.abs(ln.h - prev.h) > prev.h * 0.12) brk = true;          // 見出しと本文の切り替わり
        else if (ln.font !== prev.font && (short(ln) || short(prev))) brk = true; // 太字の見出しなど
        else if (endsSentence(prev.text.trim()) && ln.x0 > prev.x0 + 6) brk = true; // 字下げ
        else if (ln.x0 > prev.x1 || ln.x1 < prev.x0) brk = true;              // 横に離れている
      }
      if (brk) { flush(); cur = []; }
      cur.push(ln); prev = ln;
    }
    flush();
  }
  return { doc, name: file.name, pages, blocks };
}

function finishBlock(lines, page) {
  const x0 = Math.min(...lines.map((l) => l.x0)), x1 = Math.max(...lines.map((l) => l.x1));
  const top = Math.max(...lines.map((l) => l.y + l.h * 0.9));
  const bottom = Math.min(...lines.map((l) => l.y - l.h * 0.22));
  const hs = lines.map((l) => l.h).sort((a, b) => a - b);
  return { page, x0: x0 - 1, x1: x1 + 1, y0: bottom, y1: top + 0.5, fs: hs[Math.floor(hs.length / 2)],
           text: clean(lines.map((l) => l.text.trim()).join('\n')) };
}

async function handleFile(file) {
  if (!file) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { alert('PDFファイルを選んでください。'); return; }
  $('#drop').hidden = true; $('#pdfChip').hidden = false; $('#pdfName').textContent = file.name;
  $('#orLine').hidden = true; $('#src').hidden = true;
  try {
    pdf = await readPdf(file);
    const n = pdf.blocks.filter((b) => translatable(b.text)).length;
    $('#pdfInfo').textContent = `${pdf.pages.length}ページ・訳す段落 約${n}`;
    $('#go').focus();
  } catch (e) {
    $('#pdfInfo').textContent = '読み込めませんでした：' + e.message;
    pdf = null;
  }
}
function clearPdf() {
  pdf = null; $('#drop').hidden = false; $('#pdfChip').hidden = true; $('#orLine').hidden = false; $('#src').hidden = false; $('#file').value = '';
}
$('#pdfClear').onclick = clearPdf;
$('#file').onchange = (e) => handleFile(e.target.files[0]);
const drop = $('#drop');
for (const ev of ['dragenter', 'dragover']) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); });
for (const ev of ['dragleave', 'drop']) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); });
drop.addEventListener('drop', (e) => handleFile(e.dataTransfer.files[0]));
// 画面のどこにドロップしても受け付ける
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => { e.preventDefault(); if (!$('#inputView').hidden && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

// ================= プロンプトと生成 =================
function parseGlossary(text) {
  return text.split('\n').map((l) => l.split(/\s*(?:=|\t|→)\s*/)).filter((a) => a.length >= 2 && a[0].trim() && a[1].trim())
    .map(([s, t]) => [s.trim(), t.trim()]);
}
function buildPrompt(input, context) {
  let p = '<|plamo:tag|>dataset<|plamo:msg|>translation';
  if (context) p += '<|plamo:tag|>context<|plamo:msg|>' + context;
  const low = input.toLowerCase();
  const g = parseGlossary(S.glossary).filter(([s]) => low.includes(s.toLowerCase()));
  if (g.length) p += '<|plamo:tag|>glossary' + g.map(([s, t]) => `<|plamo:index|>${s}<|plamo:item|>${t}`).join('');
  p += '<|plamo:tag|>input<|plamo:msg|>' + input;
  p += `<|plamo:tag|>output<|plamo:key|>lang<|plamo:val|>${S.target}`;
  if (S.target === 'ja' && S.form) p += `<|plamo:key|>form<|plamo:val|>${S.form}`;
  return p + '<|plamo:msg|>';
}
async function generate(prompt, signal, onText) {
  const res = await fetch(base() + '/api/generate', {
    method: 'POST', signal, headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: S.model, prompt, raw: true, stream: true, keep_alive: '15m',
      options: { temperature: 0, num_ctx: 4096, num_predict: 2048, stop: STOP } }),
  });
  if (!res.ok) { let m = 'HTTP ' + res.status; try { m = (await res.json()).error || m; } catch {} throw new Error(m); }
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let buf = '', out = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line) continue;
      const j = JSON.parse(line);
      if (j.error) throw new Error(j.error);
      if (j.response) { out += j.response; onText(out); }
    }
  }
  return out.trim();
}

// ================= 結果の状態 =================
// item: { src, out, state: pending|running|done|error|skip|stopped, block?, cell?, ov? }
let items = [], controller = null;

function makeItems() {
  if (pdf) {
    let refs = false; const list = [];
    for (const b of pdf.blocks) {
      if (S.cutRefs && isRefsHeading(b.text)) refs = true;
      if (refs || !translatable(b.text)) continue;
      // 長い段落はテキスト上は分けて訳し、レイアウト上は1つの枠にまとめる
      const parts = chunk(b.text);
      parts.forEach((src, k) => list.push({ src, out: '', state: 'pending', block: b, part: k, parts: parts.length }));
    }
    return list;
  }
  return splitParagraphs($('#src').value).flatMap((p) => chunk(p))
    .map((src) => ({ src, out: '', state: translatable(src) ? 'pending' : 'skip' }))
    .map((x) => (x.state === 'skip' ? { ...x, out: x.src } : x));
}

function showView() {
  const lay = S.view === 'layout' && pdf;
  $('#layoutView').hidden = !lay; $('#textView').hidden = !!lay;
  $('#viewSeg').hidden = !pdf; $('#printBtn').hidden = !lay;
  $$('#viewSeg button').forEach((b) => b.classList.toggle('on', b.dataset.v === (lay ? 'layout' : 'text')));
  $$('#sideSeg button').forEach((b) => b.classList.toggle('on', b.dataset.s === S.side));
  $('#resultView').classList.toggle('only-ja', S.side === 'ja');
  if (lay) refitAll();
}
$$('#viewSeg button').forEach((b) => (b.onclick = () => { S.view = b.dataset.v; save(); showView(); }));
$$('#sideSeg button').forEach((b) => (b.onclick = () => { S.side = b.dataset.s; save(); showView(); }));

// ---------- テキスト表示 ----------
function renderText() {
  const out = $('#textView'); out.innerHTML = '';
  items.forEach((it, idx) => {
    const pair = document.createElement('div'); pair.className = 'pair';
    const en = document.createElement('div'); en.className = 'en'; en.textContent = it.src;
    const ja = document.createElement('div'); ja.className = 'ja';
    const redo = document.createElement('button'); redo.className = 'redo'; redo.textContent = '再翻訳';
    redo.onclick = () => runQueue([idx]);
    it.cell = ja; it.redo = redo;
    pair.append(en, ja); out.appendChild(pair);
    paint(it);
  });
}

// ---------- レイアウト表示 ----------
let io = null;
const blockItems = new Map(); // block -> items[]

function renderLayout() {
  const wrap = $('#layoutView'); wrap.innerHTML = '';
  if (!pdf) return;
  blockItems.clear();
  for (const it of items) { if (!blockItems.has(it.block)) blockItems.set(it.block, []); blockItems.get(it.block).push(it); }
  io?.disconnect();
  io = new IntersectionObserver((ents) => ents.forEach((e) => { if (e.isIntersecting) { io.unobserve(e.target); renderPage(+e.target.dataset.p); } }),
    { rootMargin: '1200px 0px' });
  pdf.pages.forEach((pg, i) => {
    const n = i + 1; const ar = pg.vp1.width / pg.vp1.height;
    const row = document.createElement('div'); row.className = 'pageRow'; row.dataset.p = n;
    for (const kind of ['orig', 'trans']) {
      const d = document.createElement('div'); d.className = 'page ' + kind; d.style.aspectRatio = ar;
      row.appendChild(d);
    }
    pg.row = row; pg.rendered = false;
    wrap.appendChild(row);
    const no = document.createElement('div'); no.className = 'pageNo'; no.textContent = `${n} / ${pdf.pages.length}`;
    wrap.appendChild(no);
    io.observe(row);
  });
}

async function renderPage(n) {
  const pg = pdf.pages[n - 1];
  if (pg.rendered) return; pg.rendered = true;
  const page = await pdf.doc.getPage(n);
  const [origEl, transEl] = pg.row.children;
  const cssW = Math.max(origEl.clientWidth, transEl.clientWidth, 600);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vp = page.getViewport({ scale: (cssW / pg.vp1.width) * dpr });
  const c1 = document.createElement('canvas'); c1.width = vp.width; c1.height = vp.height;
  await page.render({ canvasContext: c1.getContext('2d'), viewport: vp }).promise;
  const c2 = document.createElement('canvas'); c2.width = vp.width; c2.height = vp.height;
  c2.getContext('2d').drawImage(c1, 0, 0);
  origEl.appendChild(c1); transEl.appendChild(c2);
  // 訳を重ねる枠
  for (const [b, its] of blockItems) {
    if (b.page !== n) continue;
    const [x0, y0, x1, y1] = pg.vp1.convertToViewportRectangle([b.x0, b.y0, b.x1, b.y1]);
    const left = Math.min(x0, x1), top = Math.min(y0, y1), w = Math.abs(x1 - x0), h = Math.abs(y1 - y0);
    const ov = document.createElement('div'); ov.className = 'ov wait queued';
    Object.assign(ov.style, { left: pct(left, pg.vp1.width), top: pct(top, pg.vp1.height), width: pct(w, pg.vp1.width), height: pct(h, pg.vp1.height) });
    ov.dataset.fs = b.fs; ov.dataset.pw = pg.vp1.width;
    ov.title = b.text;
    transEl.appendChild(ov);
    its.forEach((it) => (it.ov = ov));
    paintOverlay(its);
  }
}
const pct = (v, total) => (100 * v / total) + '%';

function paintOverlay(its) {
  const ov = its[0]?.ov; if (!ov) return;
  const text = its.map((x) => x.out).filter(Boolean).join('');
  const busy = its.some((x) => x.state === 'running');
  const waiting = its.some((x) => x.state === 'pending' || x.state === 'running');
  ov.classList.toggle('wait', waiting && !text);
  ov.classList.toggle('queued', !busy);
  // 訳がまだなら原文が見えるように透明のまま
  ov.textContent = text;
  if (text) fit(ov);
}

// 枠に収まる一番大きな文字サイズを探す
function fit(ov) {
  const page = ov.parentElement; if (!page || !page.clientWidth) return;
  const k = page.clientWidth / +ov.dataset.pw;
  const max = Math.max(6, +ov.dataset.fs * k * 1.0);
  let lo = 4, hi = max;
  ov.style.height = ov.style.height; // 枠の高さは固定
  for (let i = 0; i < 8; i++) {
    const mid = (lo + hi) / 2; ov.style.fontSize = mid + 'px';
    if (ov.scrollHeight <= ov.clientHeight + 1) lo = mid; else hi = mid;
  }
  ov.style.fontSize = lo + 'px';
  const clipped = ov.scrollHeight > ov.clientHeight + 1;
  ov.classList.toggle('clipped', clipped);
  ov.style.setProperty('--h', ov.clientHeight + 'px');
}
function refitAll() { $$('#layoutView .ov').forEach((ov) => ov.textContent && fit(ov)); }
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(refitAll, 150); });

// ---------- 描画の更新 ----------
function paint(it) {
  if (it.cell) {
    const el = it.cell;
    el.className = 'ja' + (it.state === 'pending' || (it.state === 'running' && !it.out) ? ' pending' : '') + (it.state === 'error' ? ' error' : '');
    el.textContent = it.state === 'pending' ? '待機中…' : it.state === 'running' && !it.out ? '翻訳中…'
      : it.state === 'error' ? 'エラー：' + it.err : it.state === 'stopped' && !it.out ? '（未翻訳）' : it.out;
    if (it.redo) el.appendChild(it.redo);
  }
  if (it.block && blockItems.has(it.block)) paintOverlay(blockItems.get(it.block));
}

function setProgress() {
  const total = items.filter((x) => x.state !== 'skip').length;
  const done = items.filter((x) => x.state === 'done').length;
  const txt = total ? `${done} / ${total} 段落` : '';
  $('#progress').textContent = txt;
  if (controller) setStatus('ok', `翻訳中 ${done}/${total}`);
  else if (connected) setStatus('ok', '接続OK');
  $('#fabStop').hidden = !controller;
}

async function runQueue(indices) {
  if (controller) return;
  controller = new AbortController();
  for (const i of indices) if (items[i].state !== 'skip') { items[i].state = 'pending'; items[i].out = ''; paint(items[i]); }
  setProgress();
  try {
    for (const i of indices) {
      const it = items[i];
      if (it.state === 'skip') continue;
      it.state = 'running'; paint(it);
      // レイアウト表示中は、翻訳中の段落が見えるページを先に描く
      if (it.block) renderPage(it.block.page);
      const ctx = S.useContext && i > 0 ? items[i - 1].src.slice(-600) : '';
      try {
        it.out = await generate(buildPrompt(it.src, ctx), controller.signal, (t) => { it.out = t; paint(it); });
        it.state = 'done';
      } catch (e) {
        if (e.name === 'AbortError') { it.state = 'stopped'; it.out = ''; paint(it); throw e; }
        it.state = 'error';
        it.err = /Failed to fetch|NetworkError|Load failed/.test(e.message) ? 'Ollama につながりません' : e.message;
        paint(it);
        if (it.err.startsWith('Ollama')) { checkConnection(); break; }
      }
      paint(it); setProgress();
    }
  } catch (e) { if (e.name !== 'AbortError') console.error(e); }
  finally {
    controller = null;
    items.forEach((x) => { if (x.state === 'pending') { x.state = 'stopped'; paint(x); } });
    setProgress();
  }
}

$('#go').onclick = async () => {
  if (!pdf && !$('#src').value.trim()) { $('#src').focus(); return; }
  items = makeItems();
  if (!items.length) return;
  $('#hero').hidden = true; $('#inputView').hidden = true; $('#resultView').hidden = false;
  window.scrollTo(0, 0);
  renderText(); renderLayout(); showView();
  runQueue(items.map((_, i) => i));
};
$('#fabStop').onclick = () => controller && controller.abort();
$('#back').onclick = () => {
  controller?.abort();
  $('#resultView').hidden = true; $('#hero').hidden = false; $('#inputView').hidden = false;
  window.scrollTo(0, 0);
};
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && !$('#inputView').hidden) $('#go').click();
});

$('#copyAll').onclick = async () => {
  const text = joinedOut().join('\n\n');
  try { await navigator.clipboard.writeText(text); flash('#copyAll', 'コピーしました'); } catch { flash('#copyAll', 'コピーできませんでした'); }
};
function joinedOut() {
  const res = []; let lastBlock = null;
  for (const x of items) {
    if (!x.out) continue;
    if (x.block && x.block === lastBlock) res[res.length - 1] += x.out; else res.push(x.out);
    lastBlock = x.block || null;
  }
  return res;
}
function flash(sel, msg) { const b = $(sel), t = b.textContent; b.textContent = msg; setTimeout(() => (b.textContent = t), 1500); }
$('#dlMd').onclick = () => {
  const md = items.map((x) => `> ${x.src}\n\n${x.out}\n`).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
  a.download = (pdf ? pdf.name.replace(/\.pdf$/i, '') : 'translation') + '-ja.md';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#printBtn').onclick = async () => {
  flash('#printBtn', 'ページを準備中…');
  for (let n = 1; n <= pdf.pages.length; n++) await renderPage(n);
  refitAll();
  setTimeout(() => window.print(), 300);
};

// テスト用
window.__plamo = { splitParagraphs, buildPrompt, clean, chunk, translatable, get items() { return items; } };
</script>
